<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/hime.svg" />
		<link rel="preload" as="image" href="/hime.png" />
		<link rel="stylesheet" href="/src/settings/loading.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Settings</title>
