# =============================================================================
# Hime Assistant — Root Cargo Virtual Workspace Manifest
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80.0"
authors = ["Hime Assistant Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Irham-Najib-Azimul-Qowi/Hime"

# Centralized Dependency Version Pinning across all Workspace Crates
[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.38.0", features = ["full"] }

# Desktop Shell Framework
tauri = { version = "2.0.0", features = ["wry"] }
tauri-build = { version = "2.0.0" }

# Serialization & JSON-RPC
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"

# Embedded Database & Search
rusqlite = { version = "0.31.0", features = ["bundled", "hooks"] }

# Structured Logging & Tracing
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
tracing-appender = "0.2.3"

# Security & Memory Protection
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
sha2 = "0.10.8"

# Windows OS Native APIs (Win32)
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectComposition",
] }

# Error Handling Primitives
thiserror = "1.0.61"
anyhow = "1.0.86"

# Async Trait and Utilities
async-trait = "0.1.80"
regex = "1.10.5"

# Internal Workspace Crates
hime-ipc = { path = "crates/hime-ipc" }
hime-security = { path = "crates/hime-security" }
hime-pal = { path = "crates/hime-pal" }
hime-storage = { path = "crates/hime-storage" }
hime-core = { path = "crates/hime-core" }

# -----------------------------------------------------------------------------
# Compilation Profiles
# -----------------------------------------------------------------------------
[profile.dev]
opt-level = 0
debug = 2
overflow-checks = true
panic = "unwind"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

